<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="LuaDocs — a reference for Lua 5.1 through 5.5">
  <!--
    README banner.

    Proportions follow MDN's: a small lockup floating in a lot of space, not a mark that fills
    the frame. Theirs sits at roughly 31% of the width and an eighth of the height of a 2.5:1
    canvas; an earlier pass here had the mark at 58% of the height, which read as cramped.
    Hence 1600x560 with ~38% vertical padding above and below.

    The Lua mark is a **hand-drawn approximation**, not the official asset — the logo was
    supplied as an image in conversation and could not be written to disk. Replace it by
    dropping the real file into `assets/` and swapping the `<g id="lua-mark">` group for an
    `<image>`. Lua's logo belongs to Lua.org / PUC-Rio; this project is not affiliated with
    them, which is why README.md says so directly.

    Lua's navy is #000080, which against a near-black field is a dark blob with no readable
    edge. A white plate behind it fixed the contrast and looked like a sticker, so the sphere
    is lifted to #1e25a8 with a thin lighter rim — the ordinary dark-mode adaptation. The white
    "Lua" and the highlight need no change, and the ring is mid-grey.

    `LuaDocs`, not `luadocs`. The codebase already draws this line: human-facing uses are
    camel-case and every lowercase one is a machine identifier — localStorage keys, DOM ids,
    the worker's output buffer, the domain. MDN's lowercase wordmark works because `mdn` is an
    initialism; `Lua` is a proper noun Lua.org always capitalises.

    The lockup is left-anchored, not centred: its left margin is 216, the same as the vertical
    padding above and below, so the inset is uniform on three sides. Centred variants were tried
    at mark-x 640, 560 and 430 (the last giving mathematically equal 366px margins against the
    token field) and all three read as sitting too far right — the token field is faint enough
    that the eye does not weigh it as a counterbalance, so the composition wants an anchor rather
    than a centre.

    Presentation attributes rather than a <style> block, because GitHub's SVG sanitiser strips
    embedded stylesheets.
  -->

  <rect width="1600" height="560" fill="#08090c"/>

  <!-- Token field: Lua keywords and operators, drawn from the language rather than from its
       name. At #16181f it measured 1.12:1 against the background and was effectively
       invisible; #485065 is 2.48:1 — legible as texture while staying well below the version
       line (5.27) and the wordmark (18.4), so it reads as a field rather than as something to
       be read. -->
  <g fill="#485065" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="22">
    <text x="1180" y="132">function</text>
    <text x="1424" y="176">end</text>
    <text x="1206" y="192">..</text>
    <text x="1288" y="236">~=</text>
    <text x="1152" y="268">local</text>
    <text x="1372" y="256">#</text>
    <text x="1448" y="330">nil</text>
    <text x="1232" y="336">[[ ]]</text>
    <text x="1338" y="392">then</text>
    <text x="1166" y="400">::</text>
    <text x="1470" y="232">{ }</text>
    <text x="1306" y="148">or</text>
    <text x="1198" y="446">repeat</text>
    <text x="1408" y="446">..=</text>
  </g>

  <g id="lua-mark">
    <!-- Dashed orbital ring -->
    <circle cx="280" cy="280" r="64" fill="none" stroke="#7e8494" stroke-width="2" stroke-dasharray="7 6"/>
    <!-- Sphere. Rim one step lighter than the fill, enough to define the edge. -->
    <circle cx="280" cy="280" r="50" fill="#1e25a8" stroke="#3742d6" stroke-width="1.5"/>
    <!-- Terminator highlight, upper right inside the sphere -->
    <circle cx="298" cy="262" r="14" fill="#ffffff"/>
    <!-- Satellite, sitting on the ring at roughly one o'clock -->
    <circle cx="325" cy="235" r="15" fill="#1e25a8" stroke="#3742d6" stroke-width="1.5"/>
    <!-- Wordmark inside the sphere, slightly left of centre as in the original -->
    <text x="274" y="295"
          font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
          font-size="36" font-weight="400" fill="#ffffff" text-anchor="middle">Lua</text>
  </g>

  <!-- LuaDocs' own wordmark -->
  <text x="404" y="268"
        font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="62" font-weight="600" letter-spacing="-1"
        fill="#f4f6fa" dominant-baseline="central">LuaDocs</text>

  <!-- Version range. `y` is 328 because the wordmark's box reaches 305 and 316 left a 6px
       overlap — invisible, since `LuaDocs` has no descenders, but the spacing read as wrong. -->
  <text x="407" y="328"
        font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="18" letter-spacing="3"
        fill="#7a8494">LUA 5.1 &#8212; 5.5</text>
</svg>
