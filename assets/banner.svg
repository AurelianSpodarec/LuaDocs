<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="LuaDocs — a reference for Lua 5.1 through 5.5">
  <!--
    Temporary README banner.

    The Lua mark here is a **hand-drawn approximation**, not the official asset — the logo
    was supplied as an image in conversation and could not be written to disk. Replace it by
    dropping the real file into `assets/` and swapping the `<g id="lua-mark">` group for an
    `<image>`. Lua's logo belongs to Lua.org / PUC-Rio; this project is not affiliated with
    them, which is why README.md says so directly and why the wordmark beside the mark is
    LuaDocs' own rather than a variation on theirs.

    Lua's navy is #000080, which against a near-black field is a dark blob with no readable
    edge. A white plate behind it fixed the contrast and looked like a sticker, so the sphere
    is instead lifted to #1e25a8 with a thin lighter rim — the ordinary dark-mode adaptation,
    and far less intrusive than boxing the mark. The white "Lua" and the highlight need no
    change; they already read against the navy, and the ring is mid-grey.

    Presentation attributes rather than a <style> block, because GitHub's SVG sanitiser strips
    embedded stylesheets.
  -->

  <rect width="1600" height="420" fill="#08090c"/>

  <!-- Faint token field: Lua keywords and operators, drawn from the language rather than
       from its name. -->
  <g fill="#181b22" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="30">
    <text x="1178" y="92">function</text>
    <text x="1426" y="140">end</text>
    <text x="1210" y="152">..</text>
    <text x="1282" y="196">~=</text>
    <text x="1158" y="236">local</text>
    <text x="1368" y="228">#</text>
    <text x="1450" y="292">nil</text>
    <text x="1226" y="300">[[ ]]</text>
    <text x="1340" y="352">then</text>
    <text x="1162" y="360">::</text>
    <text x="1482" y="196">{ }</text>
    <text x="1298" y="108">or</text>
  </g>

  <g id="lua-mark">
    <!-- Centred at x=478 rather than 450: dropping the plate narrowed the mark, which left an
         88px gap to the wordmark and read as two objects instead of one lockup. -->
    <!-- Dashed orbital ring -->
    <circle cx="478" cy="210" r="122" fill="none" stroke="#7e8494" stroke-width="3" stroke-dasharray="12 10"/>
    <!-- Sphere. Rim is one step lighter than the fill, enough to define the edge without
         reading as an outline. -->
    <circle cx="478" cy="210" r="96" fill="#1e25a8" stroke="#3742d6" stroke-width="2"/>
    <!-- Terminator highlight, upper right inside the sphere -->
    <circle cx="520" cy="168" r="27" fill="#ffffff"/>
    <!-- Satellite, sitting on the ring at roughly one o'clock -->
    <circle cx="564" cy="124" r="28" fill="#1e25a8" stroke="#3742d6" stroke-width="2"/>
    <!-- Wordmark inside the sphere, set slightly left of centre as in the original -->
    <text x="466" y="248"
          font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
          font-size="68" font-weight="400" fill="#ffffff" text-anchor="middle">Lua</text>
  </g>

  <!-- LuaDocs' own wordmark.

       `LuaDocs`, not `luadocs`. The codebase already draws this line — 21 human-facing uses
       are camel-case (site title, nav, prose) and every lowercase one is a machine identifier:
       localStorage keys, DOM ids, the worker's output buffer, the domain. MDN's lowercase
       wordmark works because `mdn` is an initialism; `Lua` is a proper noun that Lua.org
       always capitalises, and lowercasing it beside their own mark reads as a mistake. -->
  <text x="660" y="196"
        font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="92" font-weight="600" letter-spacing="-1"
        fill="#f4f6fa" dominant-baseline="central">LuaDocs</text>

  <!-- Version range. `y` clears the wordmark's box, which reaches 250. -->
  <text x="664" y="284"
        font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="26" letter-spacing="4"
        fill="#5b6472">LUA 5.1 &#8212; 5.5</text>
</svg>
